version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. POSTGRESQL VERİTABANI SERVİSİ
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: saas_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saas_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ortam değişkeni zorunludur}
      POSTGRES_DB: ${POSTGRES_DB:-saas_db}
    ports:
      - "5432:5432"
    volumes:
      - saas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-saas_admin} -d $${POSTGRES_DB:-saas_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas_network

  # ----------------------------------------------------------------------------
  # 2. B2B SAAS NODE.JS UYGULAMA SUNUCUSU
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_b2b_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-5000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-saas_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-saas_db}?schema=public}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET ortam değişkeni zorunludur}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    networks:
      - saas_network

volumes:
  saas_pgdata:
    driver: local

networks:
  saas_network:
    driver: bridge
